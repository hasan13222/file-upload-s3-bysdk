name: Deploy to EC2
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: copy code
        uses: actions/checkout@v3

      - name: install node-js
        uses: actions/setup-node@v3
        with:
          node-versions: 23.10

      - name: install dependecies
        run: npm install --frozen-lockfile

      - name: configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: deploy to EC2
        env:
          EC2_HOST: ${{secrets.EC2_HOST}}
          EC2_USER: ${{secrets.EC2_USER}}
          APP_ENVS: ${{secrets.APP_ENVS}}
        run: |
          ssh $EC2_USER@$EC2_HOST "mkdir -p ~/app"
          
          rsync -avz \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.github' \
            . $EC2_USER@$EC2_HOST:~/app/

          ssh $EC2_USER@$EC2_HOST "cd ~/app && touch .env"
          echo "$APP_ENVS" > ~/app/.env

          ssh $EC2_USER@$EC2_HOST "cd ~/app && export PATH=$PATH:/run/user/1000/fnm_multishells/12474_1745056390353/bin && npm install --frozen-lockfile"

          ssh $EC2_USER@$EC2_HOST "export PATH=$PATH:/run/user/1000/fnm_multishells/12474_1745056390353/bin && pm2 delete file-upload-app || true"

          ssh $EC2_USER@$EC2_HOST "cd ~/app && export PATH=$PATH:/run/user/1000/fnm_multishells/12474_1745056390353/bin && pm2 start index.js --name file-upload-app"